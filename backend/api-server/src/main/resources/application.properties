# ========== Server ==========
server.port=8080
server.servlet.context-path=/

# ========== PostgreSQL Database ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerceweb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA/Hibernate =========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========== Logging ==========
logging.level.root=INFO
logging.level.com.commerceweb=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ========== JWT Configuration ==========
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
#(86400000ms)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== Application Name ==========
spring.application.name=commerceweb-backend

# ========== Redis ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis